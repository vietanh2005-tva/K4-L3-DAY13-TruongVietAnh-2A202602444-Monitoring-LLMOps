alerts:
  - name: high_tail_latency
    severity: page
    condition: latency_p95_ms > 3000
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: "#ai-api-alerts"
    owner: ai-api-oncall
    runbook: docs/alerts.md#alert-1-high-tail-latency
  - name: elevated_error_rate
    severity: page
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#ai-api-alerts"
    owner: ai-api-oncall
    runbook: docs/alerts.md#alert-2-elevated-error-rate
  - name: low_quality_proxy
    severity: ticket
    condition: quality_score_avg < 0.75
    duration: 30m
    type: symptom-based
    channel: slack
    slack_channel: "#ai-quality-alerts"
    owner: ai-quality-owner
    runbook: docs/alerts.md#alert-3-low-quality-proxy
